<div class="report-container p-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h2 class="h4 mb-1">Student Pipeline Report</h2>
      <p class="text-muted small mb-0">Assigned leads performance by employee</p>
    </div>
  </div>

  <div class="card shadow-sm border-0 mb-4">
    <div class="card-body">
      <!-- Date and Status Filter -->
      <div class="row g-3 align-items-end mb-4">
        <div class="col-md-3">
          <label class="form-label small text-muted">Date Range</label>
          <select class="form-select form-select-sm" [(ngModel)]="dateRange" (change)="fetchData()">
            <option value="today">Today</option>
            <option value="this_week">This Week</option>
            <option value="this_month">This Month</option>
            <option value="last_month">Last Month</option>
            <option value="ytd">Year to Date</option>
            <option value="prev_year">Previous Year</option>
            <option value="custom">Custom Range</option>
          </select>
        </div>
        <div class="col-md-3" *ngIf="dateRange === 'custom'">
          <label class="form-label small text-muted">From Date</label>
          <input type="date" class="form-control form-control-sm" [(ngModel)]="customStartDate">
        </div>
        <div class="col-md-3" *ngIf="dateRange === 'custom'">
          <label class="form-label small text-muted">To Date</label>
          <input type="date" class="form-control form-control-sm" [(ngModel)]="customEndDate">
        </div>
        
        <div class="col-md-3">
          <label class="form-label small text-muted">Status</label>
          <select class="form-select form-select-sm" [(ngModel)]="selectedStatus" (change)="fetchData()">
            <option value="All">All Statuses</option>
            <option *ngFor="let s of statuses" [value]="s.name">{{ s.name }}</option>
          </select>
        </div>
        
        <div class="col-md-2" *ngIf="dateRange === 'custom'">
          <button class="btn btn-primary btn-sm w-100" (click)="fetchData()">Apply Filter</button>
        </div>
      </div>

      <!-- Graph Section -->
      <div class="report-card mt-4">
        <h5 class="mb-1">Assigned Leads by Employee</h5>
        <p class="text-muted small mb-4">Assigned lead count (Sorted highest to lowest) - Filter: {{ selectedStatus }}</p>

        <div *ngIf="loading" class="text-center py-5">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
        </div>

        <div *ngIf="!loading && data.length > 0" class="chart-wrapper">
          <div class="chart-inner-container" [style.height.px]="chartHeight">
            <canvas baseChart
              [data]="barChartData"
              [options]="barChartOptions"
              [type]="'bar'">
            </canvas>
          </div>
        </div>

        <div *ngIf="!loading && data.length === 0" class="text-center py-5 text-muted">
          <i class="bi bi-inbox fs-1 mb-2 d-block text-black-50"></i>
          No data available for the selected filters.
        </div>
      </div>
    </div>
  </div>
</div>
