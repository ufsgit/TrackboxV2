<div class="settings-page">
  <div class="settings-nav">
    <a href="javascript:void(0)" class="nav-link" [class.active]="activeTab === 'team'" (click)="setActiveTab('team')" *ngIf="authService.hasPermission('Teams', 'view')">
      <i class="bi bi-people me-2"></i>Teams Management
    </a>
    <a href="javascript:void(0)" class="nav-link" [class.active]="activeTab === 'branch'" (click)="setActiveTab('branch')" *ngIf="authService.hasPermission('Branch', 'view')">
      <i class="bi bi-building me-2"></i>Branch Management
    </a>
    <a href="javascript:void(0)" class="nav-link" [class.active]="activeTab === 'department'" (click)="setActiveTab('department')" *ngIf="authService.hasPermission('Department', 'view')">
      <i class="bi bi-diagram-3 me-2"></i>Department Management
    </a>
    <a href="javascript:void(0)" class="nav-link" [class.active]="activeTab === 'status'" (click)="setActiveTab('status')" *ngIf="authService.hasPermission('Lead Status', 'view')">
      <i class="bi bi-tag me-2"></i>Lead Status
    </a>
    <a href="javascript:void(0)" class="nav-link" [class.active]="activeTab === 'intake'" (click)="setActiveTab('intake')" *ngIf="authService.hasPermission('Intake', 'view')">
      <i class="bi bi-calendar3 me-2"></i>Intake Management
    </a>
    <a href="javascript:void(0)" class="nav-link" [class.active]="activeTab === 'year'" (click)="setActiveTab('year')" *ngIf="authService.hasPermission('Year', 'view')">
      <i class="bi bi-calendar-year me-2"></i>Year Management
    </a>
    <a href="javascript:void(0)" class="nav-link" [class.active]="activeTab === 'app-status'" (click)="setActiveTab('app-status')" *ngIf="authService.hasPermission('Application Status', 'view')">
      <i class="bi bi-mortarboard me-2"></i>Application Status
    </a>
    <a href="javascript:void(0)" class="nav-link" [class.active]="activeTab === 'channel'" (click)="setActiveTab('channel')" *ngIf="authService.hasPermission('Channel', 'view')">
      <i class="bi bi-chat-left-dots me-2"></i>Channel Management
    </a>
  </div>

  <div class="settings-content">
    <app-teams-management *ngIf="activeTab === 'team' && authService.hasPermission('Teams', 'view')"></app-teams-management>
    <app-branch-management *ngIf="activeTab === 'branch' && authService.hasPermission('Branch', 'view')"></app-branch-management>
    <app-department-management *ngIf="activeTab === 'department' && authService.hasPermission('Department', 'view')"></app-department-management>
    <app-status-management *ngIf="activeTab === 'status' && authService.hasPermission('Lead Status', 'view')"></app-status-management>
    <app-intake-management *ngIf="activeTab === 'intake' && authService.hasPermission('Intake', 'view')"></app-intake-management>
    <app-year-management *ngIf="activeTab === 'year' && authService.hasPermission('Year', 'view')"></app-year-management>
    <app-app-status-management *ngIf="activeTab === 'app-status' && authService.hasPermission('Application Status', 'view')"></app-app-status-management>
    <app-channel-management *ngIf="activeTab === 'channel' && authService.hasPermission('Channel', 'view')"></app-channel-management>
  </div>
</div>
